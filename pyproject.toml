[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-llm-redteam-benchmark"
version = "0.2.0"
description = "A local-first LLM evaluation, judge-calibration, and safety regression platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Agentic LLM Red Team Benchmark Contributors" }]
keywords = ["llm", "evaluation", "judge-calibration", "red-team", "ai-safety", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.111",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pip-tools>=7.4",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
redteam = "redteam_benchmark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redteam_benchmark = [
  "datasets/*.json",
  "datasets/suites/*.json",
  "datasets/rubrics/*.json",
  "datasets/calibration/*.json",
  "datasets/calibration/*.jsonl",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["redteam_benchmark"]
omit = ["*/redteam_benchmark/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
